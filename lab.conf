# daos-testlab configuration (bash, sourced by bin/lab and by the node scripts).
# Everything needed to recreate the lab from scratch is here or derived from here.
# Local overrides: lab.conf.local next to this file (not in git), or `lab -c <file>` for another lab.

# --- libvirt host --------------------------------------------------------------------------------
LAB_HOST=192.168.1.83           # reachable over ssh from the machine that runs bin/lab
LAB_HOST_USER=user              # member of the "libvirt" group; no sudo needed or used
SSH_KEY=~/.ssh/keys/almaserver1 # private key for the host and the VMs (public part is baked in)
LIBVIRT_URI=qemu:///system
LIBVIRT_NET=default             # NAT network 192.168.122.0/24, DHCP leases pinned per VM
LAB_NET_CIDR=192.168.122.0/24
LAB_HOST_WORKDIR='~/daos-testlab' # small files on the host: scripts, seeds, Talos configs
# Big files go to an external SSD (Samsung T7, ext4, mounted from fstab): the host's root
# filesystem, where libvirt's default pool lives, has only a few GB free.
LAB_HOST_STORE=/mnt/keenetic/daos-testlab # builds/, cache/ (downloaded images and tools)
LIBVIRT_POOL=testlab            # storage pool for base images and VM disks
LIBVIRT_POOL_DIR=$LAB_HOST_STORE/pool # "lab check" creates the pool here if it does not exist

# --- VMs -----------------------------------------------------------------------------------------
# name role ip mac vcpus ram_mb disk_gb image kernel
#   role:   server (DAOS server + dmg + registry), client (plain DAOS client host),
#           k8s (kubeadm control plane + DAOS client; a single node without workers),
#           k8s-worker (kubeadm worker, joins the first k8s VM), talos (Talos single node).
#           Without a server VM in the config, k8s nodes get no DAOS (plain Kubernetes)
#   image:  alma9 (latest AlmaLinux 9), alma9.7 (AlmaLinux 9.7, dnf pinned to the 9.7 vault), talos
#   kernel: stock, or ml (ELRepo kernel-ml, >= 6.12, needed for idmapped FUSE mounts)
VMS=(
	"daos-1   server 192.168.122.20 52:54:00:da:05:20 6 14336 60 alma9   stock"
	"k8s-1    k8s    192.168.122.21 52:54:00:da:05:21 6 12288 40 alma9   ml"
	"client-1 client 192.168.122.22 52:54:00:da:05:22 2 4096  20 alma9.7 ml"
	"talos-1  talos  192.168.122.30 52:54:00:da:05:30 2 4096  30 talos   -"
)
# Scenarios: "group  roles or VM names". "lab use <group>" runs just these VMs; groups also work in
# start, stop and suspend. By role, so profiles can keep them. Names must not be role names.
VM_GROUPS=(
	"plain         server client"
	"kubeadm       server k8s"
	"talos-cluster server talos"
	"nlt           k8s"
	"multinode     server client k8s talos"
)
HOST_MEM_RESERVE_GB=3           # host memory kept free for the host itself when VMs are started
FTEST_SERVERS=                  # ftest (profiles/ftest.conf): VMs for launch.py -ts and -tc
FTEST_CLIENTS=
VM_USER=admin                   # created by cloud-init, passwordless sudo

# --- images --------------------------------------------------------------------------------------
IMG_alma9=https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/AlmaLinux-9-GenericCloud-latest.x86_64.qcow2
IMG_alma9_7=https://vault.almalinux.org/9.7/cloud/x86_64/images/AlmaLinux-9-GenericCloud-9.7-20260501.x86_64.qcow2
ALMA_VAULT=https://vault.almalinux.org  # used to pin "alma9.7" hosts to their minor release

# --- DAOS system ---------------------------------------------------------------------------------
DAOS_VERSION=2.8.0              # release installed from packages.daos.io on server/client/k8s
DAOS_REPO=https://packages.daos.io/v2.8.0/EL9/packages/x86_64
DAOS_REPO_KEY=https://packages.daos.io/v2.8.0/DAOS_2025_1_GPG_KEY
DAOS_SYSTEM=daos_server
DAOS_PROVIDER=ofi+tcp           # or "ofi+verbs;ofi_rxm": RDMA over software RDMA on eth0 (see
SOFT_RDMA=rxe                   # nodes/rdma.sh): rxe (Soft-RoCE) or siw (soft-iWARP)
DAOS_BUILD=                     # @<build>: provision installs this lab build instead of the release
DAOS_SCM_GB=4                   # server SCM: tmpfs (class ram), DAOS 2.8 needs >= 4
DAOS_BDEV_GB=20                 # server "NVMe": AIO file /var/daos/bdev0
DAOS_TARGETS=4
DAOS_HUGEPAGES=                 # 2 MiB hugepages for the engine; empty: DAOS default (512/target)
DAOS_RAM_RESERVED_GB=3          # RAM for the OS. DAOS refuses to start unless
                                # MemTotal - reserved - hugepages - 1 GiB >= DAOS_SCM_GB
POOL=tank
POOL_SIZE=16GB
CONT=posix
CONT_OWNER=admin                # the container is created by this user (owner@ has full rights)
# ACL entries added so that dfuse running as root on clients can use pool and container
POOL_ACL_EXTRA="A::root@:rw"
CONT_ACL_EXTRA="A::root@:rwta"
# Agent mapping for uids without a passwd entry (e.g. user-namespaced pods): user:group, or empty
AGENT_DEFAULT_USER=admin:admin

# --- Kubernetes (role k8s) -----------------------------------------------------------------------
K8S_MINOR=v1.37
CONTAINERD_VER=2.4.0
RUNC_VER=1.5.1
CNI_VER=1.9.1
GVISOR_RELEASE=20260921         # gVisor release date, or "latest" (storage.googleapis.com/gvisor)
K8S_POD_CIDR=10.244.0.0/16

# --- Talos (role talos) --------------------------------------------------------------------------
TALOS_VERSION=v1.14.1
TALOS_CLUSTER=daos-lab
TALOS_POD_CIDR=10.245.0.0/16
TALOS_EXTENSIONS="siderolabs/gvisor"

# --- lab registry (runs on the server VM, port below) --------------------------------------------
REGISTRY_PORT=5000

# --- CSI driver (k8s scenarios) ------------------------------------------------------------------
CSI_DIR=/Users/Dmitry/Music/Claude/Daos/Agent/csi-daos  # csi-daos source (deploy/ manifests)
