# The colleagues' driver with our fixes (fixed.yaml) in dfuse.mountMode supervisor: dfuse runs in
# mount jobs of daos-mount-supervisor (supervisor-fixed.yaml), the driver calls it over its socket.
# It is fixed.yaml plus what driver/src/helm (DaosInmapPatch/colleagues-csi/mount-supervisor) renders
# for mountMode supervisor: the setting and the socket directory.
---
# Source: daos-csi-driver/templates/attacher.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: daos-csi-driver-attacher-sa
  namespace: dcd
---
# Source: daos-csi-driver/templates/rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: daos-csi-driver-sa
  namespace: dcd
---
# Source: daos-csi-driver/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: daos-csi-driver-config
  namespace: dcd
data:
  driver_config.yaml: |
    telemetry:
      logger:
        SageSystem: data-proxy
        ServiceName: daos-csi-driver
        SageGroup: ml_platform_core
        K8sCluster: lab
        AppVersion: MLCORE_TAG
        Logger:
          Level: debug
      tracing:
        TenantName: default
        ServiceName: daos-csi-driver
        SageSystem: data-proxy
        SageGroup: ml_platform_core
        K8sCluster: lab
        K8sNamespace: dcd
        AppEnv: dev
        AppVersion: MLCORE_TAG
        Tracer:
          CollectorEndpoint: "collector.dtracing.dev-tcsgroup.io"
          SampleRatio: 1
      metrics:
        path: /metrics
        endpoint: :61111
        env: dev
        namespace: daos_driver
        version: MLCORE_TAG
      pprof:
        enable: false
        port: 6062
    
    health:
      port: 65080
      livenessPath: /healthz
      readinessPath: /readyz
    
    csi:
      endpoint: "unix:///csi/csi.sock"
      driverName: mlcore.daos.csi
      nodeId: "$NODE_ID"
    
    dfuse:
      cliPath: /opt/daos/bin
      defaultArgs: "--multi-user"
      mountMode: supervisor
      supervisorSocket: /run/daos-mount-supervisor/daos-mount-supervisor.sock
      mountImage: "$MOUNT_IMAGE"
      agentDir: /var/run/daos_agent
      mountPodPriorityClass: "system-node-critical"
      imagePullSecrets: [artifactory-cred-secret]
      mountDirPermission: "0777"
---
# Source: daos-csi-driver/templates/storageclass.yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: daos-storage-class
provisioner: mlcore.daos.csi
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
