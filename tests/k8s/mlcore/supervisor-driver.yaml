# Source: daos-csi-driver/templates/driver.yaml
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: daos-csi-driver
  namespace: dcd
  labels:
    app: daos-csi-driver
    release: daos-csi-driver
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
  selector:
    matchLabels:
      app: daos-csi-driver
      release: daos-csi-driver
  template:
    metadata:
      labels:
        app: daos-csi-driver
        release: daos-csi-driver
      annotations:
        sage/group: ml_platform_core
        ml-core/system: "data-proxy"
        ml-core/service_name: "daos-csi-driver"
        ml-core/logs: enabled
        ml-core/env: "dev"
        app.kubernetes.io/component: daos-csi-driver
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "61111"
    spec:
      hostNetwork: true
      hostPID: true
      imagePullSecrets:
        - name: artifactory-cred-secret
      tolerations:
      serviceAccount: daos-csi-driver-sa
      containers:
        - name: driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.6.2
          imagePullPolicy: Always
          args:
            - "--kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)"
            - "--v=4"
            - "--csi-address=$(ADDRESS)"
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: /var/lib/kubelet/plugins/mlcore.daos.csi/csi.sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration/
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
        - name: driver
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true
          image: MLCORE_REPO:MLCORE_TAG
          imagePullPolicy: Always
          command: [ "/app/daos-driver" ]
          args:
            - -config
            - /etc/config/driver_config.yaml
          livenessProbe:
            httpGet:
              path: /healthz
              port: 65080
              scheme: HTTP
            initialDelaySeconds: 25
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 65080
              scheme: HTTP
            initialDelaySeconds: 25
            periodSeconds: 5
          ports:
            - containerPort: 6062
            - containerPort: 61111
          env:
            # mount pods run dfuse from the driver's own image
            - name: MOUNT_IMAGE
              value: MLCORE_REPO:MLCORE_TAG
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            # all of /var/lib/kubelet: the pods' volumes, and the staging paths where mount pods
            # mount dfuse (kubelet, mount pods and the driver must see the same mounts)
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: "Bidirectional"
            - mountPath: /etc/config
              name: driver-config
              readOnly: true
            - name: daos-sock
              mountPath: /var/run/daos_agent
              readOnly: true
            # daos-mount-supervisor's gRPC socket
            - name: supervisor-sock
              mountPath: /run/daos-mount-supervisor
          resources: 
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: DirectoryOrCreate
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/mlcore.daos.csi
            type: DirectoryOrCreate
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: driver-config
          configMap:
            name: daos-csi-driver-config
        - name: daos-sock
          hostPath:
            path: /var/run/daos_agent
            type: DirectoryOrCreate
        - name: supervisor-sock
          hostPath:
            path: /run/daos-mount-supervisor
            type: DirectoryOrCreate
---
# Source: daos-csi-driver/templates/attacher.yaml
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: daos-csi-driver-attacher
  namespace: dcd
  labels:
    app: daos-csi-driver-attacher
    release: daos-csi-driver
spec:
  serviceName: daos-csi-driver-attacher-svc
  replicas: 1
  selector:
    matchLabels:
      app: daos-csi-driver-attacher
      release: daos-csi-driver
  template:
    metadata:
      labels:
        app: daos-csi-driver-attacher
        release: daos-csi-driver
      annotations:
        app.kubernetes.io/component: daos-csi-driver
    spec:
      serviceAccount: daos-csi-driver-attacher-sa
      tolerations:
      affinity:
      imagePullSecrets:
        - name: artifactory-cred-secret
      containers:
        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.0.0
          args:
            - "--v=4"
            - "--csi-address=$(ADDRESS)"
          env:
            - name: ADDRESS
              value: /var/lib/kubelet/plugins/mlcore.daos.csi/csi.sock
          imagePullPolicy: Always
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/kubelet/plugins/mlcore.daos.csi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/mlcore.daos.csi
            type: DirectoryOrCreate
---
# Source: daos-csi-driver/templates/csidriver.yaml
# Without this object Kubernetes assumes attachRequired: true: every pod waits for a
# VolumeAttachment that the single csi-attacher replica marks attached through the driver socket
# of the node it runs on (with no nodeSelector, it may be a node without the driver). DAOS volumes
# need no attach step. The attacher stays deployed for VolumeAttachments created before this.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: mlcore.daos.csi
spec:
  attachRequired: false
  podInfoOnMount: false
  # dfuse presents DAOS ownership as is: kubelet must not chown the volume for fsGroup
  fsGroupPolicy: None
  volumeLifecycleModes: [Persistent]
