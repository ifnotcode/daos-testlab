# DAOS's own functional tests (ftest, avocado, as upstream CI runs them on VMs) on a lab build:
#   bin/lab suspend                                   # the main lab: memory
#   bin/lab -c profiles/ftest.conf up
#   bin/lab -c profiles/ftest.conf deploy ft-server rpms @<build>
#   bin/lab -c profiles/ftest.conf deploy ft-server tests daos-server daos-admin daos-client-tests
#   bin/lab -c profiles/ftest.conf deploy ft-client rpms @<build>
#   bin/lab -c profiles/ftest.conf deploy ft-client tests daos-client-tests
#   bin/lab -c profiles/ftest.conf test ftest ft-client [TAGS=dfuse,vm] [FORCE_IDMAP=1]
# The ftest harness sets up and starts its own DAOS server and agents, so these VMs have neither.
# ft-client runs launch.py and the clients; ELRepo kernel-ml there, for dfuse --allow-idmap.
VMS=(
	"ft-server ftest 192.168.122.50 52:54:00:da:05:50 8 12288 30 alma9.7 stock"
	"ft-client ftest 192.168.122.51 52:54:00:da:05:51 6 4096  20 alma9.7 ml"
)
VM_GROUPS=(
	"ftest-pair ftest"
)
FTEST_SERVERS=ft-server
FTEST_CLIENTS=ft-client
