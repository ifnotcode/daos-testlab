# Second, independent lab on the same host, used to check that a lab can be recreated from scratch
# (and as an example of a profile). Sourced after lab.conf: only the differences are here.
#   bin/lab -c profiles/verify.conf up
#   bin/lab -c profiles/verify.conf destroy vdaos-1 vk8s-1 vclient-1 vtalos-1 --yes
# Names, IPs and MACs must not collide with the other labs on the libvirt network.
VMS=(
	"vdaos-1   server 192.168.122.40 52:54:00:da:05:40 4 10240 40 alma9   stock"
	"vk8s-1    k8s    192.168.122.41 52:54:00:da:05:41 4 6144  30 alma9   ml"
	"vclient-1 client 192.168.122.42 52:54:00:da:05:42 2 3072  20 alma9.7 ml"
	"vtalos-1  talos  192.168.122.43 52:54:00:da:05:43 2 4096  20 talos   -"
)
# own pod networks and cluster name, so that nothing is shared with the main lab
K8S_POD_CIDR=10.246.0.0/16
TALOS_POD_CIDR=10.247.0.0/16
TALOS_CLUSTER=daos-lab-verify
DAOS_BDEV_GB=8
POOL=vtank
POOL_SIZE=6GB
# small server (10 GB VM): 2 targets, for which the default 1024 hugepages are too few for the
# engine's DMA buffers; MemTotal 9.7 GiB - 1 reserved - 3 hugepages - 1 = 4.7 >= 4 GiB SCM
DAOS_TARGETS=2
DAOS_HUGEPAGES=1536
DAOS_RAM_RESERVED_GB=1
