# Lab with DAOS over RDMA: provider "ofi+verbs;ofi_rxm" on Soft-RoCE (rdma_rxe on eth0, see
# nodes/rdma.sh), since the host has no RDMA hardware. Sourced after lab.conf.
#   bin/lab suspend                                   # the main lab: memory
#   bin/lab -c profiles/rdma.conf up
#   bin/lab -c profiles/rdma.conf test smoke rclient-1
# Soft-RoCE is slow (about 1 Gbit/s, 60 us per round trip between these VMs): it shows whether
# things work over verbs, not how fast.
VMS=(
	"rdaos-1   server 192.168.122.60 52:54:00:da:05:60 4 10240 40 alma9   stock"
	"rclient-1 client 192.168.122.62 52:54:00:da:05:62 2 3072  20 alma9.7 ml"
	"rk8s-1    k8s    192.168.122.61 52:54:00:da:05:61 4 8192  30 alma9   ml"
)
VM_GROUPS=(
	"rdma-hosts server client"
	"rdma-all   server client k8s"
)
DAOS_PROVIDER="ofi+verbs;ofi_rxm"
# DAOS finds software RDMA devices only with patchsets/soft-rdma (a lab-only patch; see
# docs/gotchas.md): servers and clients all run this build
DAOS_BUILD=@el9-master-0dbc4dd-idmap-softrdma
SOFT_RDMA=rxe
K8S_POD_CIDR=10.248.0.0/16
POOL=rtank
POOL_SIZE=6GB
DAOS_BDEV_GB=8
# small server (10 GB VM), as in profiles/verify.conf
DAOS_TARGETS=2
DAOS_HUGEPAGES=1536
DAOS_RAM_RESERVED_GB=1
