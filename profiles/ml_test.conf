# The colleagues' test cluster "ml_test", as far as the survey of 2026-10-18 shows it
# (docs/cluster-survey/reports/, part2/): a Talos node (kernel 6.18), Kubernetes 1.36.2, a DAOS
# server outside the cluster with an insecure transport, the DAOS agent as a privileged hostPID
# DaemonSet in namespace daos-client that maps unknown uids to nobody:nobody, their CSI driver
# (mlcore.daos.csi) in namespace daos-csi-driver, a static PV, a hostUsers: false pod with uid 1234.
# The scenario itself (agent, driver, PV, pod, driver restart) is tests/k8s-ml-test.sh.
#   bin/lab suspend                                   # the main lab: memory
#   bin/lab -c profiles/ml_test.conf up
#   bin/lab -c profiles/ml_test.conf images push 192.168.122.20:5000/mlcore-csi:orig-v2.8.0 \
#       192.168.122.20:5000/mlcore-csi:fixed-v2.8.0-r2
#   bin/lab -c profiles/ml_test.conf test k8s-ml-test mttalos-1 VARIANT=orig IMAGE=@mlcore-csi:orig-v2.8.0
#   bin/lab -c profiles/ml_test.conf test k8s-ml-test mttalos-1 VARIANT=fixed IMAGE=@mlcore-csi:fixed-v2.8.0-r2
# (not colleagues-csi:repro: that build has no health server, and the chart's liveness probe then
# restarts the driver every ~40 s)
# The colleagues' daos-mount-supervisor (tests/k8s-ml-supervisor.sh): images from
# DaosInmapPatch/colleagues-csi/mount-supervisor/lab/build.sh (pushed to the registry of this
# profile), and Volcano's images once:
#   podman pull docker.io/volcanosh/vc-{webhook-manager,controller-manager,scheduler}:v1.15.3  # on the host
#   bin/lab -c profiles/ml_test.conf images push docker.io/volcanosh/vc-webhook-manager:v1.15.3 \
#       docker.io/volcanosh/vc-controller-manager:v1.15.3 docker.io/volcanosh/vc-scheduler:v1.15.3
#   bin/lab -c profiles/ml_test.conf test k8s-ml-supervisor mttalos-1 SUP=fixed SUP_TAG=fixed-r4 \
#       IMAGE=@mlcore-csi:fixed-v2.8.0-sup-r1
# Not like theirs: flannel instead of Cilium, Ethernet/tcp instead of InfiniBand, one VM node,
# Talos 1.14.1 with kernel 6.18.51 (theirs 6.18.42), DAOS 2.8.0 server (theirs: unknown).
VMS=(
	"mtdaos-1  server 192.168.122.70 52:54:00:da:05:70 4 10240 40 alma9 stock"
	"mttalos-1 talos  192.168.122.73 52:54:00:da:05:73 4 8192  30 talos -"
)
VM_GROUPS=(
	"ml-test server talos"
)
TALOS_K8S_VERSION=1.36.2
TALOS_CLUSTER=ml-test
TALOS_POD_CIDR=10.249.0.0/16
# as their agent: unknown uids (user-namespaced pods) become nobody
AGENT_DEFAULT_USER=nobody:nobody
POOL=mltank
POOL_SIZE=6GB
DAOS_BDEV_GB=8
# small server (10 GB VM), as in profiles/verify.conf
DAOS_TARGETS=2
DAOS_HUGEPAGES=1536
DAOS_RAM_RESERVED_GB=1
